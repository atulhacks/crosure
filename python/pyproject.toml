[project]
name = "crosure"
version = "0.1.0"
description = "Verify Crosure investigation chains and load Crosure datasets for training"
requires-python = ">=3.9"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
hf = ["datasets>=2.14"]

[project.scripts]
crosure-py = "crosure.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["crosure"]
